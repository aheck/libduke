name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: python -m pip install "conan>=2,<3" meson ninja pkgconf

      - name: Detect compiler
        run: conan profile detect --force

      - name: Install dependencies
        run: conan install . --output-folder=build-ci --build=missing -s build_type=Release

      # Keep assertions active in the regression tests, including release builds.
      - name: Configure
        run: meson setup build-ci --native-file=build-ci/conan_meson_native.ini --buildtype=release -Db_ndebug=false -Db_sanitize=none -Dcheck_tests=true

      - name: Compile libraries, tools, and tests
        run: meson compile -C build-ci

      - name: Run tests
        run: meson test -C build-ci --no-rebuild --print-errorlogs

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: build-ci/meson-logs/
          if-no-files-found: ignore
